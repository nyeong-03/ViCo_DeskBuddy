<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>모닝 — 데스크 비서 시제품</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap');
:root{--ink:#393334;--muted:#91878a;--pink:#f4a4b6;--pale:#fff7f5;--line:#f0e6e2;--lav:#eee9ff;--green:#dceee0}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 78% 25%,#f8eee9 0,#f3e8e2 33%,#eae0da 100%);font-family:'Gowun Dodum',sans-serif;color:var(--ink);display:grid;place-items:center;padding:30px}
.desktop{position:relative;width:min(1040px,100%);height:min(720px,calc(100vh - 60px));min-height:610px;border-radius:24px;background:linear-gradient(125deg,#ffffff 0%,#fffaf8 62%,#f8f0ed 100%);box-shadow:0 30px 80px #553f3d30,inset 0 0 0 1px #ffffffd9;overflow:hidden}
.desktop:before{content:"";position:absolute;width:390px;height:390px;border-radius:50%;background:#fae9e3;right:-100px;top:125px;opacity:.56}.desktop:after{content:"";position:absolute;width:300px;height:300px;border-radius:50%;background:#f5e7eb;left:36%;bottom:-200px;opacity:.5}
.topbar{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 25px;border-bottom:1px solid #f2e9e6;position:relative;z-index:1}.brand{font:22px Jua;color:#614f51;letter-spacing:.3px}.brand span{font:12px 'Gowun Dodum';color:#a89a9b;margin-left:7px}.win{display:flex;gap:8px}.dot{width:9px;height:9px;border-radius:50%;background:#eadbd8}
.workspace{position:relative;z-index:1;height:calc(100% - 64px);display:grid;grid-template-columns:1fr 330px;gap:26px;padding:30px 34px}.main h1{font:30px Jua;margin:3px 0 4px}.sub{color:var(--muted);font-size:14px}.date{font-size:12px;color:#a59796;margin-top:9px}.section-title{display:flex;justify-content:space-between;align-items:center;margin:31px 0 12px;font:19px Jua}.tag{font:12px 'Gowun Dodum';background:#fff;border:1px solid var(--line);padding:5px 10px;border-radius:99px;color:#928183}.cards{display:grid;gap:10px}.card{background:#fff;border:1px solid #f1e8e4;border-radius:15px;padding:14px 16px;display:flex;align-items:center;gap:13px;box-shadow:0 4px 16px #704e4008}.time{font:15px Jua;color:#8f7776;min-width:51px}.vline{width:3px;height:36px;background:var(--pink);border-radius:4px}.event-name{font-size:14px;font-weight:bold}.event-meta{font-size:11px;color:#a69b9c;margin-top:4px}.empty{padding:19px;background:#fff;border-radius:15px;color:#a69b9c;font-size:13px;text-align:center;border:1px dashed #ebddda}.task-list{display:grid;gap:9px}.task{background:#ffffffc9;border:1px solid #f3e9e5;border-radius:13px;padding:11px 14px;display:flex;gap:10px;align-items:center;font-size:13px}.check{width:17px;height:17px;border-radius:6px;border:1.5px solid #e3c9ca;background:#fff;cursor:pointer;flex:none}.task.done{color:#b1a9a8;text-decoration:line-through}.task.done .check{background:#b7d8be;border-color:#b7d8be;position:relative}.task.done .check:after{content:'✓';color:white;position:absolute;left:3px;top:-2px;font-size:13px}
.side{position:relative;display:flex;flex-direction:column;align-items:center;padding-top:12px}.widget{width:100%;background:#ffffffde;border:1px solid #f1e4e2;border-radius:23px;padding:17px;box-shadow:0 15px 38px #6b4f4317;backdrop-filter:blur(8px)}.widget-head{display:flex;align-items:center;justify-content:space-between}.online{font-size:11px;color:#76a47d}.online:before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:#8ac594;margin-right:6px}.collapse{border:0;background:#f7eeec;border-radius:8px;width:27px;height:25px;color:#8d7c7d;cursor:pointer}.mascot-wrap{display:grid;place-items:center;padding:14px 0 8px}.mascot{width:114px;height:112px;filter:drop-shadow(0 6px 3px #8b61501b)}.bubble{background:#fff8f6;border:1px solid #f2e5e1;border-radius:14px;padding:12px 13px;font-size:13px;line-height:1.6;position:relative}.bubble:before{content:'';position:absolute;top:-6px;left:26px;width:11px;height:11px;background:#fff8f6;border-left:1px solid #f2e5e1;border-top:1px solid #f2e5e1;transform:rotate(45deg)}.bubble strong{color:#765d60}.widget-actions{display:flex;gap:7px;margin-top:12px}.btn{border:0;border-radius:11px;background:#675bce;color:#fff;font:14px Jua;padding:10px 12px;cursor:pointer;box-shadow:0 5px 12px #675bce2b}.btn.secondary{background:#f5efed;color:#786a6b;box-shadow:none}.feed{margin-top:15px;width:100%;background:#fff;border-radius:17px;border:1px solid #f0e5e2;padding:14px;box-shadow:0 8px 24px #6b4f430d}.feed-head{font:14px Jua;display:flex;justify-content:space-between}.feed-head small{font:10px 'Gowun Dodum';color:#9b8c8e}.integration{display:flex;gap:9px;align-items:center;padding:11px 0 2px;color:#968a8c;font-size:12px}.slack-icon,.mail-icon{width:25px;height:25px;display:grid;place-items:center;border-radius:8px;background:#f5f0ee;font-size:13px}.badge{margin-left:auto;font-size:10px;border-radius:99px;background:#f6f1ef;padding:4px 7px;color:#a19495}.connect-note{font-size:10px;color:#aa9fa0;line-height:1.5;padding:7px 3px 0}
.add{position:absolute;right:28px;bottom:25px;border:0;background:#675bce;color:#fff;border-radius:15px;font:15px Jua;padding:12px 17px;box-shadow:0 8px 18px #675bce38;cursor:pointer;z-index:2}.modal-bg{position:fixed;inset:0;background:#34272c55;display:none;place-items:center;z-index:9;padding:20px}.modal-bg.show{display:grid}.modal{width:min(390px,100%);background:white;border-radius:20px;padding:22px;box-shadow:0 20px 70px #20141655}.modal h2{font:21px Jua;margin:0 0 17px}.field{display:grid;gap:6px;margin:12px 0;font-size:12px;color:#807577}.field input,.field select{font:14px 'Gowun Dodum';padding:11px;border:1px solid #eee2df;border-radius:10px;color:#413a3b;background:#fff}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.notification{position:fixed;right:24px;top:24px;z-index:12;background:#fff;border:1px solid #f0dfdc;border-radius:16px;padding:15px 18px;box-shadow:0 12px 35px #38212533;max-width:320px;display:none}.notification.show{display:block;animation:pop .25s ease-out}.notification strong{font:16px Jua;display:block;margin-bottom:5px}.notification span{font-size:13px;color:#766d6e}@keyframes pop{from{transform:translateY(-10px);opacity:0}to{transform:translateY(0);opacity:1}}
.foot{position:absolute;bottom:13px;left:28px;color:#b5a9a8;font-size:10px;z-index:2}
@media(max-width:760px){body{padding:0}.desktop{height:100vh;min-height:650px;border-radius:0}.workspace{grid-template-columns:1fr;padding:23px 20px;overflow:auto}.main{padding-bottom:20px}.side{padding-bottom:66px}.desktop{overflow:auto}.topbar{position:sticky;top:0;background:#fffaf8}.feed{max-width:400px}.add{position:fixed;right:20px;bottom:18px}}
</style></head>
<body>
<div class="desktop">
 <header class="topbar"><div class="brand">모닝<span>나만의 데스크 비서 · 첫 시제품</span></div><div class="win"><i class="dot"></i><i class="dot"></i><i class="dot"></i></div></header>
 <div class="workspace">
  <main class="main"><div class="date" id="today"></div><h1>오늘도 같이 챙겨볼게요</h1><div class="sub">일정과 할 일을 한눈에 모아봤어요.</div>
   <div class="section-title">다가오는 일정 <span class="tag" id="event-count">0개</span></div><div class="cards" id="events"></div>
   <div class="section-title">오늘의 할 일 <span class="tag">눌러서 완료</span></div><div class="task-list" id="tasks"></div>
  </main>
  <aside class="side"><section class="widget" id="widget"><div class="widget-head"><span class="online">함께 있는 중</span><button class="collapse" id="collapse" title="접기">⌄</button></div><div id="widget-content"><div class="mascot-wrap">
   <svg class="mascot" viewBox="0 0 120 120" aria-label="노란 스마일" role="img"><circle cx="60" cy="60" r="49" fill="#FFE36E" stroke="#282521" stroke-width="3"/><circle cx="43" cy="49" r="4.5" fill="#282521"/><circle cx="77" cy="49" r="4.5" fill="#282521"/><path d="M38 68 Q60 91 82 68" fill="none" stroke="#282521" stroke-width="4" stroke-linecap="round"/></svg>
  </div><div class="bubble" id="bubble"><strong>안녕!</strong> 오늘 일정과 할 일을 같이 챙겨보자. 먼저 아래에서 일정을 하나 추가해봐.</div><div class="widget-actions"><button class="btn" id="add-fast">＋ 일정 추가</button><button class="btn secondary" id="notify-test">알림 미리보기</button></div></div></section>
   <section class="feed"><div class="feed-head">새로 온 소식 <small>연동 대기 중</small></div><div class="integration"><span class="slack-icon">✳</span><span>Slack</span><span class="badge">연결 전</span></div><div class="integration"><span class="mail-icon">✉</span><span>메일 · 캘린더</span><span class="badge">연결 전</span></div><div class="connect-note">실제 메시지나 계정에는 아직 연결되지 않았어요.<br>다음 단계에서 사용할 서비스를 함께 연결해요.</div></section>
  </aside>
 </div><div class="foot">시제품 · 일정은 이 브라우저에만 저장됩니다</div><button class="add" id="add-event">＋ 새 일정</button>
</div>
<div class="modal-bg" id="modal"><form class="modal" id="form"><h2>일정 하나 추가할까요?</h2><label class="field">일정 이름<input id="title" maxlength="70" placeholder="예: 팀 회의" required></label><label class="field">날짜와 시간<input id="when" type="datetime-local" required></label><label class="field">몇 분 전에 알려줄까요?<select id="before"><option value="5">5분 전</option><option value="10" selected>10분 전</option><option value="15">15분 전</option><option value="30">30분 전</option><option value="60">1시간 전</option></select></label><div class="modal-actions"><button type="button" class="btn secondary" id="cancel">취소</button><button class="btn">저장</button></div></form></div>
<div class="notification" id="toast"><strong id="toast-title">모닝 알림</strong><span id="toast-body"></span></div>
<script>
const key='morning-buddy-events-v1';let events=JSON.parse(localStorage.getItem(key)||'[]');let tasks=[{text:'메일과 메시지 확인하기',done:false},{text:'오늘 가장 중요한 일 하나 정하기',done:false}];
const $=s=>document.querySelector(s),fmt=new Intl.DateTimeFormat('ko-KR',{month:'long',day:'numeric',weekday:'long'}),tf=new Intl.DateTimeFormat('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false});
$('#today').textContent=fmt.format(new Date());
function paint(){events.sort((a,b)=>new Date(a.when)-new Date(b.when));$('#event-count').textContent=events.length+'개';let now=new Date();let upcoming=events.filter(e=>new Date(e.when)>now);$('#events').innerHTML=upcoming.length?upcoming.slice(0,5).map(e=>`<article class="card"><div class="time">${tf.format(new Date(e.when))}</div><div class="vline"></div><div><div class="event-name">${esc(e.title)}</div><div class="event-meta">${fmt.format(new Date(e.when))} · ${e.before}분 전 알림</div></div></article>`).join(''):'<div class="empty">아직 등록한 일정이 없어요. 오른쪽 아래에서 추가해보세요.</div>';$('#tasks').innerHTML=tasks.map((t,i)=>`<div class="task ${t.done?'done':''}" data-task="${i}"><button class="check" aria-label="완료 표시"></button>${esc(t.text)}</div>`).join('');document.querySelectorAll('.task').forEach(el=>el.onclick=()=>{let i=+el.dataset.task;tasks[i].done=!tasks[i].done;paint()});if(upcoming.length){let n=upcoming[0];$('#bubble').innerHTML=`<strong>다음 일정은 ${tf.format(new Date(n.when))}</strong><br>${esc(n.title)} · ${n.before}분 전에 알려줄게!`}else $('#bubble').innerHTML='<strong>안녕!</strong> 오늘 일정과 할 일을 같이 챙겨보자. 먼저 아래에서 일정을 하나 추가해봐.';}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function open(){let d=new Date(Date.now()+3600000);d.setMinutes(Math.ceil(d.getMinutes()/5)*5,0,0);$('#when').value=new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16);$('#modal').classList.add('show');$('#title').focus()}function close(){$('#modal').classList.remove('show')}
$('#add-event').onclick=open;$('#add-fast').onclick=open;$('#cancel').onclick=close;$('#modal').onclick=e=>{if(e.target===$('#modal'))close()};$('#form').onsubmit=e=>{e.preventDefault();events.push({id:crypto.randomUUID(),title:$('#title').value.trim(),when:new Date($('#when').value).toISOString(),before:+$('#before').value,alerted:false});localStorage.setItem(key,JSON.stringify(events));$('#title').value='';close();paint();};
function toast(title,body){$('#toast-title').textContent=title;$('#toast-body').textContent=body;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),9000);try{if(Notification.permission==='granted')new Notification(title,{body})}catch{}}
$('#notify-test').onclick=()=>{toast('모닝 알림 미리보기','테스트 알림이 이렇게 표시돼요.');if('Notification'in window&&Notification.permission==='default')Notification.requestPermission()};
$('#collapse').onclick=()=>{let c=$('#widget-content'),hide=c.style.display!=='none';c.style.display=hide?'none':'';$('#collapse').textContent=hide?'＋':'⌄'};
setInterval(()=>{let changed=false;for(let e of events){let due=new Date(e.when).getTime()-e.before*60000;if(!e.alerted&&Date.now()>=due&&Date.now()<new Date(e.when).getTime()){e.alerted=true;changed=true;toast('곧 시작해요',e.title+' · '+e.before+'분 전 알림')}}if(changed){localStorage.setItem(key,JSON.stringify(events));paint()}},15000);paint();
</script></body></html>
